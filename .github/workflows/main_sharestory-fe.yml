# fe(Vite React) → Azure Static Web Apps
#
# 빌드는 GitHub Actions 에서 한다. (Oryx 를 쓰지 않음 → Node 버전을 여기서 고정)
# 이미 빌드된 결과를 올리므로 skip_app_build: true.
#
# Secret: AZURE_STATIC_WEB_APPS_API_TOKEN_JOLLY_SKY_065E76F00
#   Azure 포털 > Static Web App > 개요 > 배포 토큰 관리
#
# SPA 새로고침 처리는 fe/public/staticwebapp.config.json 이 담당한다.
# (vite 가 public/ 아래를 dist/ 로 그대로 복사한다)

name: Deploy fe to Azure Static Web Apps

on:
  push:
    branches:
      - main
    paths:
      - 'fe/**'
      - '.github/workflows/main_sharestory-fe.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: fe/package-lock.json

      # VITE_* 는 빌드 시점에 번들로 박힌다.
      # 값은 리포지토리 Secrets 에서 주입한다 (.env.production 은 더 이상 커밋하지 않음).
      #   Settings > Secrets and variables > Actions > Secrets
      - name: Build
        working-directory: fe
        env:
          VITE_API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          npm ci
          npm run build

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GENTLE_DUNE_050421500 }}
          action: upload
          app_location: 'fe/dist'
          skip_app_build: true
          output_location: ''
