components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: POST /auth/login에서 반환된 token을 입력합니다.
  responses:
    Error400:
      description: 입력값/DB 검증 실패
      content:
        application/json:
          schema:
            '$ref': '#/components/schemas/Error'
    Error401:
      description: Bearer 인증 헤더 누락, 유효하지 않거나 만료된 토큰, 또는 로그인 사용자 식별자 없음
      content:
        application/json:
          schema:
            '$ref': '#/components/schemas/Error'
    Error403:
      description: 모임 접근 권한 없음 (토큰 오류는 401)
      content:
        application/json:
          schema:
            '$ref': '#/components/schemas/Error'
    Error404:
      description: 대상 리소스 없음
      content:
        application/json:
          schema:
            '$ref': '#/components/schemas/Error'
    Error409:
      description: 중복 데이터 또는 현재 상태에서 처리 불가
      content:
        application/json:
          schema:
            '$ref': '#/components/schemas/Error'
    Error500:
      description: 서버 또는 데이터베이스 오류
      content:
        application/json:
          schema:
            '$ref': '#/components/schemas/Error'
    Error504:
      description: 데이터베이스 쿼리 시간 초과
      content:
        application/json:
          schema:
            '$ref': '#/components/schemas/Error'
  schemas:
    BigId:
      type: string
      pattern: '^[1-9][0-9]*$'
      example: '1'
