---
openapi: 3.0.3
info:
  title: 쉐어스토리 Backend API
  version: 1.0.0
  description: |-
    be/src/app.js에 실제 연결된 라우트와 컨트롤러/서비스/모델 기준 문서입니다.

    인증: POST /auth/login의 token을 Swagger Authorize에 입력하세요. Bearer 접두사는 자동으로 붙습니다. 역할은 계정의 고정 속성이 아니라 모임별 leader_id/Apply 관계입니다.

    응답: 대부분 { success, document }를 사용하지만 아이디 중복 확인은 { message, count }입니다. 공통 errorHandler는 success 없이 { message }만 반환합니다. 날짜/시간 문자열과 BIGINT 문자열을 구분하세요.

    현재 구현 범위: 세션 배치 router는 app.js에 등록되어 있지 않아 호출 가능한 paths에 포함하지 않았습니다. 파일 업로드 middleware도 라우트에 연결되어 있지 않습니다. 로그북 승인, 리뷰 수정/삭제, 모임 종료 처리 API는 없습니다. complete-meetups.job.js는 비어 있습니다.

    실행 참고: 현재 meetup.service.js가 참조하는 common/services/mailer.service.js가 누락되어 앱 시작을 막습니다. swagger-ui-express 의존성은 있지만 Swagger UI 경로는 app.js에 등록되어 있지 않습니다. 이 파일은 Swagger Editor/UI에서 별도로 불러올 수 있습니다. 회원정보 수정 API의 기존 오류는 해당 작업 설명을 확인하세요.

    캡틴 화면 조회 순서: GET /member/meetups/captain → 모임 선택 → GET /member/meetups/{meetup_id}/crews 및 /sessions → 세션 선택 → GET /logbook/meetups/{meetup_id}/sessions/{session_id}. 마지막 응답의 크루를 선택하여 logbook을 표시하며 null이면 미제출 상태를 표시합니다.
servers:
  - url: http://localhost:{port}
    description: 로컬 서버 (PORT 환경변수에 맞게 설정)
    variables:
      port:
        default: '3000'
tags:
  - name: Auth
    description: 회원가입, 로그인 및 아이디 확인
  - name: Meetup
    description: 모임 생성·수정·공개 조회·신청
  - name: Member
    description: 마이페이지 및 모임 참여
  - name: Logbook
    description: 크루 로그북 제출·수정과 캡틴 조회
  - name: Review
    description: 종료된 모임 리뷰
paths:
  '/auth/signup':
    post:
      tags:
        - Auth
      operationId: signup
      summary: 회원가입
      description: readingAmount를 monthly_reading_volume에, genres의 첫 두 항목을 genre_1/genre_2에
        저장합니다. 감사용 사용자 ID는 가입 user_id로 설정합니다. 모든 필드를 BE에서 검증하며(400),
        아이디(탈퇴 회원 포함)·이메일 중복 시 409를 반환합니다.
      security: []
      responses:
        '201':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  document:
                    type: object
                    properties:
                      name:
                        type: string
                      user_id:
                        type: string
                  message:
                    type: string
                required:
                  - success
                  - document
                  - message
        '400':
          '$ref': '#/components/responses/Error400'
        '409':
          '$ref': '#/components/responses/Error409'
        '500':
          '$ref': '#/components/responses/Error500'
        '504':
          '$ref': '#/components/responses/Error504'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              '$ref': '#/components/schemas/SignupRequest'
            example:
              user_id: reader01
              password: Example1234!
              name: 독서회원
              email: reader@example.com
              gender: F
              age_group: 30대
              readingAmount: BOOKS_1_2
              genres:
                - NOVEL
                - ESSAY
  '/auth/login':
    post:
      tags:
        - Auth
      operationId: login
      summary: 로그인
      description:
        반환된 token을 Authorize에 입력합니다. JWT 만료는 하루(JWT_EXPIRES_IN, 기본 1d)입니다.
        document에는 비밀번호 해시를 제외한 회원 정보만 반환합니다. 아이디·비밀번호 불일치는 401입니다.
      security: []
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  token:
                    type: string
                  message:
                    type: string
                  document:
                    '$ref': '#/components/schemas/LoginUser'
                required:
                  - success
                  - token
                  - message
                  - document
        '400':
          '$ref': '#/components/responses/Error400'
        '401':
          '$ref': '#/components/responses/Error401'
        '500':
          '$ref': '#/components/responses/Error500'
        '504':
          '$ref': '#/components/responses/Error504'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              '$ref': '#/components/schemas/LoginRequest'
            example:
              user_id: reader_01
              password: Example1234!
  '/auth/check-id':
    post:
      tags:
        - Auth
      operationId: checkUserId
      summary: 아이디 중복 확인
      description:
        아이디 중복 확인입니다(기존 경로 /auth/getMyInfo에서 변경). document 래퍼 없이 count와
        message를 반환합니다. 탈퇴 회원 아이디도 사용 중으로 셉니다. 형식이 틀린 아이디는 400입니다.
      security: []
      responses:
        '400':
          '$ref': '#/components/responses/Error400'
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  count:
                    type: integer
                    minimum: 0
                required:
                  - message
                  - count
        '500':
          '$ref': '#/components/responses/Error500'
        '504':
          '$ref': '#/components/responses/Error504'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              '$ref': '#/components/schemas/CheckUserIdRequest'
            example:
              user_id: reader01
  '/auth/updateMyInfo':
    patch:
      tags:
        - Auth
      operationId: updateMyInfo
      summary: 회원정보 수정 (본인)
      description:
        토큰의 사용자 정보만 수정합니다(body.user_id는 무시). 보낸 필드만 검증 후 수정합니다.
        비밀번호 변경 시 new_password와 current_password가 모두 필요하며, 현재 비밀번호가 틀리면 400입니다.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  document:
                    '$ref': '#/components/schemas/LoginUser'
                  message:
                    type: string
                required:
                  - success
                  - document
                  - message
        '400':
          '$ref': '#/components/responses/Error400'
        '401':
          '$ref': '#/components/responses/Error401'
        '404':
          '$ref': '#/components/responses/Error404'
        '409':
          '$ref': '#/components/responses/Error409'
        '500':
          '$ref': '#/components/responses/Error500'
        '504':
          '$ref': '#/components/responses/Error504'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              '$ref': '#/components/schemas/UpdateMyInfoRequest'
            example:
              name: 새닉네임
              genres:
                - NOVEL
  '/meetup':
    post:
      tags:
        - Meetup
      operationId: createMeetup
      summary: 모임 및 4개 세션 생성
      description:
        로그인 사용자가 캡틴입니다. 모임은 RECRUITING, 세션은 SCHEDULED로 생성됩니다. 예시 deadline은
        실행 시 현재 이후 날짜로 변경하세요.
      security:
        - bearerAuth: []
      responses:
        '201':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  document:
                    '$ref': '#/components/schemas/SavedMeetupDocument'
                  message:
                    type: string
                required:
                  - success
                  - document
                  - message
        '400':
          '$ref': '#/components/responses/Error400'
        '404':
          '$ref': '#/components/responses/Error404'
        '500':
          '$ref': '#/components/responses/Error500'
        '401':
          '$ref': '#/components/responses/Error401'
        '403':
          '$ref': '#/components/responses/Error403'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              '$ref': '#/components/schemas/CreateMeetupRequest'
            example:
              title: 함께 읽는 독서 모임
              description: 네 번의 독서 토론을 진행합니다.
              book_title: 함께 읽을 책
              price: 10000
              min_capacity: 4
              max_capacity: 8
              deadline: '2026-11-01T00:00:00Z'
              sessions:
                - session_number: 1
                  topic: 1회차 독서 토론
                  sch_date: '2026-11-07'
                  sch_day: 토요일
                  sch_time: '19:00'
                  sch_st_time: '19:00'
                  sch_ed_time: '21:00'
                - session_number: 2
                  topic: 2회차 독서 토론
                  sch_date: '2026-11-14'
                  sch_day: 토요일
                  sch_time: '19:00'
                  sch_st_time: '19:00'
                  sch_ed_time: '21:00'
                - session_number: 3
                  topic: 3회차 독서 토론
                  sch_date: '2026-11-21'
                  sch_day: 토요일
                  sch_time: '19:00'
                  sch_st_time: '19:00'
                  sch_ed_time: '21:00'
                - session_number: 4
                  topic: 4회차 독서 토론
                  sch_date: '2026-11-28'
                  sch_day: 토요일
                  sch_time: '19:00'
                  sch_st_time: '19:00'
                  sch_ed_time: '21:00'
    get:
      tags:
        - Meetup
      operationId: listMeetups
      summary: 공개 모임 목록
      description: 취소되지 않은 세션의 회차 순서로 시작/종료 일정을 계산합니다.
      security: []
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  document:
                    type: object
                    properties:
                      page:
                        type: integer
                        minimum: 1
                      limit:
                        type: integer
                        minimum: 1
                        maximum: 100
                      total:
                        type: integer
                        minimum: 0
                      nextPage:
                        type: integer
                        nullable: true
                      items:
                        type: array
                        items:
                          '$ref': '#/components/schemas/MeetupListItem'
                    required:
                      - page
                      - limit
                      - total
                      - nextPage
                      - items
                required:
                  - success
                  - document
        '500':
          '$ref': '#/components/responses/Error500'
      parameters:
        - name: page
          in: query
          description: 잘못된 숫자는 1로 보정합니다.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: 잘못된 숫자는 10, 100 초과는 100으로 보정합니다.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: keyword
          in: query
          description: 모임 제목 부분 검색 (대소문자 무시)
          schema:
            type: string
        - name: status
          in: query
          description: ''
          schema:
            '$ref': '#/components/schemas/MeetupStatus'
  '/meetup/{meetup_id}':
    get:
      tags:
        - Meetup
      operationId: getMeetupDetail
      summary: 공개 모임 상세
      description: 세션 일정과 신청자 독서 성향 통계를 반환합니다. Zoom 접속 정보는 포함하지 않습니다.
      security: []
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  document:
                    '$ref': '#/components/schemas/MeetupDetail'
                required:
                  - success
                  - document
        '400':
          '$ref': '#/components/responses/Error400'
        '404':
          '$ref': '#/components/responses/Error404'
        '500':
          '$ref': '#/components/responses/Error500'
      parameters:
        - name: meetup_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^[1-9][0-9]*$'
            example: '1'
          description:
            양의 정수 식별자. member/logbook/review 및 신청 API는 최대 9223372036854775807까지
            문자열로 처리합니다. 기존 모임 상세/수정은 Number로 변환합니다.
    patch:
      tags:
        - Meetup
      operationId: updateMeetup
      summary: 캡틴의 모임 및 세션 수정
      description:
        캡틴만 수정 가능합니다. 세션 수정 시 sch_time이 sch_st_time과 sch_ed_time에 모두 저장되는
        현재 구현에 유의하세요.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  document:
                    '$ref': '#/components/schemas/SavedMeetupDocument'
                  message:
                    type: string
                required:
                  - success
                  - document
                  - message
        '400':
          '$ref': '#/components/responses/Error400'
        '404':
          '$ref': '#/components/responses/Error404'
        '500':
          '$ref': '#/components/responses/Error500'
        '401':
          '$ref': '#/components/responses/Error401'
        '403':
          '$ref': '#/components/responses/Error403'
      parameters:
        - name: meetup_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^[1-9][0-9]*$'
            example: '1'
          description:
            양의 정수 식별자. member/logbook/review 및 신청 API는 최대 9223372036854775807까지
            문자열로 처리합니다. 기존 모임 상세/수정은 Number로 변환합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              '$ref': '#/components/schemas/UpdateMeetupRequest'
            example:
              meetup:
                title: 변경된 독서 모임
  '/meetup/{meetup_id}/apply':
    post:
      tags:
        - Meetup
      operationId: applyMeetup
      summary: 모임 신청
      description:
        member/meetup.controller가 처리합니다. 요청 본문 없이 로그인 사용자로 신청하며 Apply 전체를
        반환합니다(payment_status 없음). 모집 중이고 마감 전이며 정원이 남아 있어야 합니다. 캡틴의 자기 모임 신청은 400,
        중복/마감/정원 초과는 409입니다. 별도 승인·결제 없이 ING 상태로 참여합니다.
      security:
        - bearerAuth: []
      responses:
        '201':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  document:
                    '$ref': '#/components/schemas/Apply'
                required:
                  - success
                  - document
        '400':
          '$ref': '#/components/responses/Error400'
        '404':
          '$ref': '#/components/responses/Error404'
        '409':
          '$ref': '#/components/responses/Error409'
        '500':
          '$ref': '#/components/responses/Error500'
        '504':
          '$ref': '#/components/responses/Error504'
        '401':
          '$ref': '#/components/responses/Error401'
        '403':
          '$ref': '#/components/responses/Error403'
      parameters:
        - name: meetup_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^[1-9][0-9]*$'
            example: '1'
          description:
            양의 정수 식별자. member/logbook/review 및 신청 API는 최대 9223372036854775807까지
            문자열로 처리합니다. 기존 모임 상세/수정은 Number로 변환합니다.
  '/member/meetups/{meetup_id}/apply':
    post:
      tags:
        - Member
      operationId: applyMemberMeetup
      summary: 모임 신청
      description:
        member/meetup.controller가 처리합니다. 요청 본문 없이 로그인 사용자로 신청하며 Apply 전체를
        반환합니다(payment_status 없음). 모집 중이고 마감 전이며 정원이 남아 있어야 합니다. 캡틴의 자기 모임 신청은 400,
        중복/마감/정원 초과는 409입니다. 별도 승인·결제 없이 ING 상태로 참여합니다.
      security:
        - bearerAuth: []
      responses:
        '201':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  document:
                    '$ref': '#/components/schemas/Apply'
                required:
                  - success
                  - document
        '400':
          '$ref': '#/components/responses/Error400'
        '404':
          '$ref': '#/components/responses/Error404'
        '409':
          '$ref': '#/components/responses/Error409'
        '500':
          '$ref': '#/components/responses/Error500'
        '504':
          '$ref': '#/components/responses/Error504'
        '401':
          '$ref': '#/components/responses/Error401'
        '403':
          '$ref': '#/components/responses/Error403'
      parameters:
        - name: meetup_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^[1-9][0-9]*$'
            example: '1'
          description:
            양의 정수 식별자. member/logbook/review 및 신청 API는 최대 9223372036854775807까지
            문자열로 처리합니다. 기존 모임 상세/수정은 Number로 변환합니다.
  '/member/meetups/{meetup_id}/sessions':
    get:
      tags:
        - Member
      operationId: listMemberSessions
      summary: 참여 모임의 세션 조회
      description: 캡틴 또는 해당 모임의 크루만 조회 가능합니다. 회차 오름차순이며 취소 세션도 포함합니다. Zoom 정보는 제외합니다.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  document:
                    type: array
                    items:
                      '$ref': '#/components/schemas/MemberSession'
                required:
                  - success
                  - document
        '400':
          '$ref': '#/components/responses/Error400'
        '404':
          '$ref': '#/components/responses/Error404'
        '500':
          '$ref': '#/components/responses/Error500'
        '504':
          '$ref': '#/components/responses/Error504'
        '401':
          '$ref': '#/components/responses/Error401'
        '403':
          '$ref': '#/components/responses/Error403'
      parameters:
        - name: meetup_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^[1-9][0-9]*$'
            example: '1'
          description:
            양의 정수 식별자. member/logbook/review 및 신청 API는 최대 9223372036854775807까지
            문자열로 처리합니다. 기존 모임 상세/수정은 Number로 변환합니다.
  '/logbook/meetups/{meetup_id}/sessions/{session_id}/me':
    get:
      tags:
        - Logbook
      operationId: getMyLogbook
      summary: 내 세션 로그북 조회
